<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Вход · Ironman</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=23">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .login { width: 100%; max-width: 380px; }
    .login-brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; text-align: center; }
    .login-brand img { width: 56px; height: 56px; border-radius: 15px; }
    .login-brand h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
    .login-brand p { margin: 0; color: var(--muted); }
    .login .card { padding: 24px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field span { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
    .field input {
      font: inherit; font-size: 15px; color: var(--ink); background: var(--page);
      border: 1px solid var(--border); border-radius: 11px; padding: 11px 13px; outline: none;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .login .btn.primary { width: 100%; padding: 11px; font-size: 15px; margin-top: 4px; }
    .err { display: none; margin-bottom: 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px; background: var(--bad-soft); color: var(--bad-ink); }
    .err.on { display: block; }
    .foot { margin-top: 18px; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="login">
    <div class="login-brand">
      <img src="icons/icon.svg" alt="">
      <h1>Ironman Dashboard</h1>
      <p>План, факт и восстановление на пути к старту</p>
    </div>
    <form class="card" id="f" autocomplete="on">
      <div class="err" id="err" role="alert"></div>
      <label class="field"><span>Логин</span>
        <input name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
      <label class="field"><span>Пароль</span>
        <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Войти</button>
    </form>
    <div class="foot">Вход для спортсмена и тренера</div>
  </main>
  <script>
    const f = document.getElementById("f"), err = document.getElementById("err");
    f.onsubmit = async (e) => {
      e.preventDefault();
      const b = f.querySelector("button"); b.disabled = true; err.classList.remove("on");
      try {
        const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login: f.login.value, password: f.password.value }) });
        if (r.ok) { location.replace("/"); return; }
        const d = await r.json().catch(() => ({}));
        err.textContent = d.detail || "Не удалось войти"; err.classList.add("on");
        f.password.value = ""; f.password.focus();
      } catch { err.textContent = "Нет связи с сервером"; err.classList.add("on"); }
      b.disabled = false;
    };
  </script>
</body>
</html>
